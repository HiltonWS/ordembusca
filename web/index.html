<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordo Realitas · Monitor de Mecânicas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0908; --panel:#14110f; --panel-2:#1b1613;
    --ink:#e7e2d7; --muted:#847c6f; --line:#2a231e;
    --sangue:#c0202e; --morte:#3f9b6a; --conhecimento:#d4a72c;
    --energia:#8664d6; --medo:#cfd2d8; --profundezas:#1f7a8c;
    --pericia:#4fa3bd; --condicao:#d4703a; --recurso:#54b3a2; --atributo:#8bbf63;
    --poder:#c78ab0; --caracteristica:#5891c7; --mascara:#b27ab8;
    --armadura:#5876a3; --arma:#a85f55; --item:#a98b59; --idade:#6597a5;
    --trilha:#4e9aa3; --vestimenta:#70a56d;
    --acessorio:#c39a4e; --sinergia:#a875b5; --bonus:#65a96d; --multiplicador:#c65b55;
    --classe:#4d91a8; --sobrevivente:#b08b45; --nex:#557fbd;
    --perseguicao:#b17d45; --combate:#b85353;
    --efeito:#9a6baa; --dt:#4d9ca8;
    --glow:rgba(192,32,46,.14);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--void); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    background-image:
      radial-gradient(120% 80% at 50% -10%, var(--glow), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* Top bar --------------------------------------------------------------*/
  header{
    display:flex; align-items:center; gap:16px; padding:14px 22px;
    border-bottom:1px solid var(--line); background:rgba(10,9,8,.7);
    backdrop-filter:blur(6px);
  }
  .mark{
    font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:.24em;
    text-transform:uppercase; font-size:15px;
  }
  .mark small{display:block;font-weight:400;letter-spacing:.34em;font-size:9.5px;color:var(--muted);margin-top:2px}
  .status{margin-left:auto;display:flex;align-items:center;gap:10px;
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.15em}
  .dot{width:8px;height:8px;border-radius:50%;background:#4a4038}
  .dot.live{background:var(--sangue);box-shadow:0 0 10px var(--sangue);animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  /* Main -----------------------------------------------------------------*/
  main{flex:1;display:grid;grid-template-columns:minmax(0,38%) minmax(0,62%);min-height:0}
  .col{min-height:0;min-width:0;display:flex;flex-direction:column}
  .col.feed{border-right:1px solid var(--line)}
  .col-head{
    font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.28em;
    font-size:11px;color:var(--muted);padding:14px 22px 10px;
    display:flex;align-items:center;gap:10px;
  }
  .col-head::after{content:"";flex:1;height:1px;background:var(--line)}
  .tabs{display:flex;gap:2px;margin-left:auto}
  .tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);
    padding:5px 8px;font-family:'Oswald',sans-serif;text-transform:uppercase;
    letter-spacing:.12em;font-size:10px;cursor:pointer}
  .tab.active{color:var(--ink);border-color:var(--sangue)}
  .view.hidden{display:none}
  .scroll{flex:1;min-width:0;overflow-y:auto;padding:4px 22px 22px;scrollbar-width:thin;
    scrollbar-color:var(--line) transparent}
  .scroll::-webkit-scrollbar{width:8px}
  .scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  /* Transcript feed ------------------------------------------------------*/
  .line{font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.55;
    padding:7px 0;border-bottom:1px dashed rgba(42,35,30,.7);color:#c8c1b4}
  .line .ts{color:var(--sangue);opacity:.8;margin-right:10px;font-size:11px}
  .line.new{animation:fadein .5s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  /* Mechanic cards -------------------------------------------------------*/
  .cards{display:flex;flex-direction:column;gap:12px}
  .card{
    position:relative;background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-left:4px solid var(--accent,#555);
    border-radius:3px;padding:14px 16px 15px;animation:cardin .45s cubic-bezier(.2,.7,.3,1)}
  .card.has-thumb{padding-right:132px;min-height:128px}
  .thumb{position:absolute;right:14px;top:14px;width:102px;height:102px;
    object-fit:cover;border:1px solid var(--line);border-radius:3px;background:var(--void)}
  @keyframes cardin{from{opacity:0;transform:translateX(10px)}to{opacity:1}}
  .card .eyebrow{font-family:'Oswald',sans-serif;text-transform:uppercase;
    letter-spacing:.2em;font-size:10px;color:var(--accent,#999);
    display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .card .eyebrow .cat{color:var(--muted)}
  .card h3{margin:0;font-family:'Oswald',sans-serif;font-weight:600;
    font-size:20px;letter-spacing:.01em;display:flex;align-items:baseline;
    gap:10px;flex-wrap:wrap}
  .badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;
    padding:2px 7px;border-radius:2px;letter-spacing:.08em;
    background:var(--accent,#555);color:#0a0908;text-transform:uppercase}
  .card p.sum{margin:9px 0 0;font-size:13.5px;line-height:1.5;color:#cfc9bc}
  .card .tier{margin:9px 0 0;padding:8px 10px;border-radius:2px;
    background:rgba(255,255,255,.04);border:1px dashed var(--accent,#555);
    font-size:13px;line-height:1.5;color:#dcd6c8}
  .card .tier b{font-family:'Oswald',sans-serif;text-transform:uppercase;
    letter-spacing:.12em;font-size:11px;color:var(--accent,#999)}
  .card .ref{margin-top:9px;font-family:'JetBrains Mono',monospace;font-size:10.5px;
    color:var(--muted);letter-spacing:.05em;display:flex;gap:12px;flex-wrap:wrap}
  .card .ref b{color:#b5ac9c;font-weight:500}
  .count{position:absolute;top:12px;right:14px;font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--accent,#999);opacity:.9}
  .story{display:flex;flex-direction:column;gap:0;border-left:1px solid var(--line);margin-left:7px}
  .scene{position:relative;padding:0 0 22px 24px}
  .scene.renewed{animation:renew .5s ease}
  @keyframes renew{0%{filter:brightness(1.7)}100%{filter:brightness(1)}}
  .scene::before{content:"";position:absolute;left:-5px;top:7px;width:9px;height:9px;
    border-radius:50%;background:var(--sangue);box-shadow:0 0 8px var(--glow)}
  .scene .time{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}
  .scene h3{font-family:'Oswald',sans-serif;font-size:17px;margin:4px 0 5px;letter-spacing:0}
  .scene p{font-size:13px;line-height:1.5;color:#cfc9bc;margin:0}
  .scene img{width:100%;max-height:220px;object-fit:cover;margin:9px 0 0;
    border:1px solid var(--line);border-radius:3px}
  .scene .mechanics{font-family:'JetBrains Mono',monospace;font-size:10px;
    color:var(--muted);margin-top:7px}
  /* empty state ----------------------------------------------------------*/
  .empty{color:var(--muted);font-size:13px;line-height:1.6;padding:8px 0}
  .empty code{font-family:'JetBrains Mono',monospace;color:#b5ac9c;
    background:var(--panel-2);padding:1px 5px;border-radius:2px}
  /* input bar ------------------------------------------------------------*/
  .inbar{display:flex;gap:8px;padding:12px 22px;border-top:1px solid var(--line);
    background:rgba(10,9,8,.6)}
  .inbar input{flex:1;background:var(--panel);border:1px solid var(--line);
    color:var(--ink);padding:9px 12px;border-radius:3px;font-family:'JetBrains Mono',monospace;
    font-size:12.5px}
  .inbar input:focus{outline:none;border-color:var(--sangue)}
  .inbar button{background:var(--sangue);color:#0a0908;border:none;padding:9px 18px;
    border-radius:3px;font-family:'Oswald',sans-serif;text-transform:uppercase;
    letter-spacing:.14em;font-size:12px;font-weight:600;cursor:pointer}
  .inbar button:hover{filter:brightness(1.1)}
  @media(max-width:820px){
    main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
    .col.feed{border-right:none;border-bottom:1px solid var(--line)}
    .card.has-thumb{padding-right:112px}.thumb{width:82px;height:82px}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <header>
    <div class="mark">Ordo Realitas<small>Monitor de Mecânicas · Tempo Real</small></div>
    <div class="status"><span id="dot" class="dot"></span><span id="stat">conectando…</span></div>
  </header>
  <main>
    <section class="col feed">
      <div class="col-head">Transmissão</div>
      <div class="scroll" id="feed">
        <div class="empty" id="feed-empty">Aguardando fala da mesa…</div>
      </div>
    </section>
    <section class="col">
      <div class="col-head">Sessão
        <div class="tabs">
          <button class="tab active" data-view="mechanics">Mecânicas</button>
          <button class="tab" data-view="story">História</button>
        </div>
      </div>
      <div class="scroll view" id="mechanics-view">
        <div class="cards" id="cards">
          <div class="empty" id="cards-empty">
            Nenhuma mecânica ainda. Fale (ou digite abaixo) algo como
            <code>conjura Sopro do Caos e faz teste de Ocultismo</code>.
          </div>
        </div>
      </div>
      <div class="scroll view hidden" id="story-view">
        <div class="story" id="story"></div>
      </div>
    </section>
  </main>
  <div class="inbar">
    <input id="txt" placeholder="Digite uma fala para testar a detecção…"
           autocomplete="off">
    <button id="send">Detectar</button>
  </div>

<script>
const ELEM = {Sangue:'--sangue',Morte:'--morte',Conhecimento:'--conhecimento',
              Energia:'--energia',Medo:'--medo',Profundezas:'--profundezas'};
const CAT = {ritual:'--energia',pericia:'--pericia',condicao:'--condicao',
             recurso:'--recurso',atributo:'--atributo',poder:'--poder',
             caracteristica:'--caracteristica',mascara:'--mascara',
             armadura:'--armadura',arma:'--arma',item:'--item',idade:'--idade',
             trilha:'--trilha',vestimenta:'--vestimenta',
             acessorio:'--acessorio',sinergia:'--sinergia',bonus:'--bonus',
             multiplicador:'--multiplicador',classe:'--classe',
             sobrevivente:'--sobrevivente',nex:'--nex',
             perseguicao:'--perseguicao',combate:'--combate',
             efeito:'--efeito',dt:'--dt'};
const CIRC = {1:'1º',2:'2º',3:'3º',4:'4º'};
const CATLABEL = {ritual:'ritual',pericia:'perícia',condicao:'condição',
                  recurso:'recurso',atributo:'atributo',poder:'poder',
                  caracteristica:'característica única',mascara:'máscara',
                  armadura:'armadura',arma:'arma',item:'item',idade:'regra de idade',
                  trilha:'trilha',vestimenta:'vestimenta',
                  acessorio:'acessório',sinergia:'sinergia',bonus:'bônus',
                  multiplicador:'multiplicador de dano',classe:'classe',
                  sobrevivente:'sobrevivente',nex:'alteração de NEX',
                  perseguicao:'perseguição',combate:'combate',
                  efeito:'efeito',dt:'teste de resistência'};
const cards = document.getElementById('cards');
const feed  = document.getElementById('feed');
const cardsScroll = document.getElementById('mechanics-view');
const story=document.getElementById('story');
const recent = [];  // termos recentes p/ agrupar repetições

function autoscrollToBottom(el){
  if(!el) return;
  requestAnimationFrame(()=>{ el.scrollTop = el.scrollHeight; });
}

function accentFor(d){
  if(d.elemento && ELEM[d.elemento]) return `var(${ELEM[d.elemento]})`;
  return `var(${CAT[d.category]||'--muted'})`;
}
function addLine(ev){
  document.getElementById('feed-empty')?.remove();
  const m=Math.floor(ev.start_s/60), s=Math.floor(ev.start_s%60);
  const ts=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const el=document.createElement('div');
  el.className='line new';
  el.innerHTML=`<span class="ts">${ts}</span>${escapeHtml(ev.text)}`;
  feed.appendChild(el);
  while(feed.children.length>300) feed.firstElementChild.remove();
  autoscrollToBottom(feed);
}
function addCard(d){
  document.getElementById('cards-empty')?.remove();
  // agrupa se o mesmo termo apareceu entre os 4 cards mais recentes
  const key=d.term+'|'+d.category+'|'+(d.tier||'');
  const existing=recent.slice(0,4).find(r=>r.key===key);
  if(existing){
    existing.n++; existing.node.querySelector('.count').textContent='×'+existing.n;
    autoscrollToBottom(cardsScroll);
    return;
  }
  const accent=accentFor(d);
  const el=document.createElement('div');
  el.className=`card${d.thumbnail?' has-thumb':''}`; el.style.setProperty('--accent',accent);
  const circ=(d.elemento&&d.circulo)?` · ${CIRC[d.circulo]||d.circulo} círculo`:'';
  const eyebrow=d.elemento
     ? `${d.elemento}${circ}<span class="cat">/ ${CATLABEL[d.category]||d.category}</span>`
     : `${CATLABEL[d.category]||d.category}`;
  const badge=d.elemento
     ? `<span class="badge">${d.elemento}${d.circulo?` ${d.circulo}`:''}</span>` : '';
  const tierBadge=d.tier?`<span class="badge">★ ${escapeHtml(d.tier)}</span>`:'';
  const tierBlock=d.tier
     ? `<div class="tier"><b>★ ${escapeHtml(d.tier)}</b> ${escapeHtml(d.tier_summary||'')}</div>`
     : '';
  const ref=[
     d.source?`<b>${escapeHtml(d.source)}</b>`:'',
     d.loc ? escapeHtml(d.loc) : (d.page?`p.${d.page}`:''),
     `conf. ${d.score}%`
  ].filter(Boolean).join('<span>·</span>');
  el.innerHTML=`
     <div class="count"></div>
      ${d.thumbnail?`<img class="thumb" src="${encodeURI(d.thumbnail)}" alt="${escapeHtml(d.term)}" loading="lazy">`:''}
     <div class="eyebrow">${eyebrow}</div>
     <h3>${escapeHtml(d.term)} ${badge} ${tierBadge}</h3>
     ${d.summary?`<p class="sum">${escapeHtml(d.summary)}</p>`:''}
    ${d.details?`<p class="sum">${escapeHtml(d.details)}</p>`:''}
     ${tierBlock}
     <div class="ref">${ref}</div>`;
  cards.appendChild(el);
  recent.unshift({key,n:1,node:el});
  while(cards.children.length>60) cards.firstElementChild.remove();
  while(recent.length>60) recent.pop();
  autoscrollToBottom(cardsScroll);
}
function addStory(scene){
  if(!scene) return;
  const seconds=Number(scene.start_s||0);
  const time=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(Math.floor(seconds%60)).padStart(2,'0')}`;
  let el=story.querySelector(`[data-scene="${scene.id}"]`);
  const updating=Boolean(el);
  if(!el){el=document.createElement('article');el.className='scene';el.dataset.scene=scene.id;}
  const mechanics=(scene.mechanics||[]).map(item=>escapeHtml(item.term)).join(' · ');
  el.innerHTML=`<span class="time">${time}</span><h3>${escapeHtml(scene.title)}</h3>
    <p>${escapeHtml(scene.text)}</p>
    ${scene.thumbnail?`<img src="${encodeURI(scene.thumbnail)}" alt="${escapeHtml(scene.title)}" loading="lazy">`:''}
    ${mechanics?`<div class="mechanics">${mechanics}</div>`:''}`;
  if(!updating)story.appendChild(el);else el.classList.add('renewed');
  setTimeout(()=>el.classList.remove('renewed'),500);
  while(story.children.length>120) story.firstElementChild.remove();
}
function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>(
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  const ws=new WebSocket(`${proto}://${location.host}/ws`);
  const dot=document.getElementById('dot'), stat=document.getElementById('stat');
  ws.onopen=()=>{dot.className='dot live';stat.textContent='ao vivo';};
  ws.onclose=()=>{dot.className='dot';stat.textContent='desconectado';
    setTimeout(connect,2000);};
  ws.onmessage=e=>{
    const msg=JSON.parse(e.data);
    if(msg.type==='hello'){stat.textContent=msg.source==='demo'?'modo teste':'ao vivo';}
    if(msg.type==='event'){
      if(msg.text) addLine(msg);
      (msg.detections||[]).forEach(addCard);
      addStory(msg.story_scene);
    }
    if(msg.type==='end'){stat.textContent='fim do áudio';}
  };
}
connect();

fetch('/story').then(response=>response.json()).then(data=>(data.scenes||[]).forEach(addStory));
document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item===button));
  document.getElementById('mechanics-view').classList.toggle('hidden',button.dataset.view!=='mechanics');
  document.getElementById('story-view').classList.toggle('hidden',button.dataset.view!=='story');
}));

let healthVersion = null;
async function watchReload(){
  try{
    const res = await fetch('/health?ts=' + Date.now(), {cache:'no-store'});
    if(!res.ok) return;
    const data = await res.json();
    if(!healthVersion){
      healthVersion = data.version || null;
      return;
    }
    if(data.version && data.version !== healthVersion){
      window.location.reload();
    }
  }catch(_err){
    // silencioso: a conexão já se reestabelece no reload do servidor
  }
}
watchReload();
setInterval(watchReload, 1200);

// input manual -> /simulate
async function send(){
  const i=document.getElementById('txt'); const t=i.value.trim();
  if(!t) return; i.value='';
  try{
    const res = await fetch('/simulate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:t})});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
  }catch(err){
    stat.textContent='erro ao detetar';
    console.error('Falha em /simulate:', err);
  }
}
document.getElementById('send').onclick=send;
document.getElementById('txt').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
</script>
</body>
</html>
