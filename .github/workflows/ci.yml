name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (core + test)
        run: |
          python -m pip install --upgrade pip
          pip install PyMuPDF rapidfuzz pytest

      - name: Run tests
        # roda sem os livros (material com direitos autorais não é versionado);
        # a fixture em tests/fixtures.py cobre o detector por completo
        run: python -m pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check ordem/ tests/ *.py
      - name: Format check
        run: ruff format --check ordem/ tests/ *.py
        continue-on-error: true
