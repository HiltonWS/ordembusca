name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and test before release
        run: |
          python -m pip install --upgrade pip
          pip install PyMuPDF rapidfuzz python-docx pytest
          python -m pytest tests/ -v --tb=short

      - name: Build release package
        # empacota apenas o que é versionado (sem livros, sem ordem.db)
        run: |
          mkdir -p dist
          zip -r "dist/ordem-mecanicas-${GITHUB_REF_NAME}.zip" \
            ordem/ tests/ web/ \
            ingest.py query.py listen.py server.py \
            README.md LICENSE requirements.txt pyproject.toml \
            -x "*/__pycache__/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
